spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ekyc_db}
    username: ${SPRING_DATASOURCE_USERNAME:ekyc_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ekyc_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 600000
  restclient:
    connect-timeout: 5000
    read-timeout: 10000
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      indent_output: true

swapi:
  base-url: https://swapi.dev/api

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com:
      example:
        app:
          starwars: DEBUG
    org:
      springframework:
        web:
          client: DEBUG